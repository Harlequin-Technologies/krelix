name: PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .
      - name: Mypy
        working-directory: backend
        run: uv run mypy src
      - name: Pytest
        working-directory: backend
        run: uv run pytest --cov=krelix --cov-report=term

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: frontend
        run: pnpm lint
      - name: Prettier check
        working-directory: frontend
        run: pnpm format:check
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Vitest
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install agent deps
        working-directory: agent
        run: uv sync --frozen
      - name: Ruff check
        working-directory: agent
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: agent
        run: uv run ruff format --check .
      - name: Mypy
        working-directory: agent
        run: uv run mypy src
      - name: Pytest
        working-directory: agent
        run: uv run pytest

  docker-control:
    runs-on: ubuntu-24.04
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: krelix-control:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-agent:
    runs-on: ubuntu-24.04
    needs: [agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: false
          tags: krelix-agent:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

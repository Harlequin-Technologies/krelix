[project]
name = "krelix"
version = "0.0.1"
description = "Krelix control plane backend (FastAPI + SQLAlchemy 2 async + arq)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Brian Rodenkirk", email = "brian.rodenkirk@harlequintechnologies.com" }
]
dependencies = []

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "T20", "RUF"]
ignore = ["E501"]  # line length enforced by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert in tests is fine

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "pwdlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

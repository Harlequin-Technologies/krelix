[project]
name = "krelix"
version = "0.0.1"
description = "Krelix control plane backend (FastAPI + SQLAlchemy 2 async + arq)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Brian Rodenkirk", email = "brian.rodenkirk@harlequintechnologies.com" }
]
dependencies = [
    "alembic>=1.14.0",
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.15.0",
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.20",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
krelix-api = "krelix.__main__:run_api"
krelix-worker = "krelix.__main__:run_worker"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "T20", "RUF"]
ignore = ["E501"]  # line length enforced by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and fake credentials in tests are fine

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "pwdlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "types-redis>=4.6.0.20241004",
]
